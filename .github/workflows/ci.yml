name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check-and-lint:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build check (Next.js)
        run: npm run build
        env:
          # Use a dummy Convex URL for build validation
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://dummy.convex.cloud' }}
          # Disable Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: 1

  convex-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Convex schema
        run: |
          echo "Checking Convex schema syntax..."
          npx tsc convex/schema.ts --noEmit --skipLibCheck

      - name: Check Convex functions
        run: |
          echo "Checking all Convex functions..."
          find convex -name "*.ts" -not -path "convex/_generated/*" -exec npx tsc {} --noEmit --skipLibCheck \;
