name: Convex Backup (Manual Only)

on:
  # Scheduled backups disabled to save costs
  # Uncomment the schedule section below to re-enable daily backups
  # schedule:
  #   # Run at 2 AM UTC daily
  #   - cron: "0 2 * * *"

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      include_file_storage:
        description: "Include file storage in backup"
        required: false
        default: true
        type: boolean
      upload_to_cloud:
        description: "Upload to cloud storage"
        required: false
        default: true
        type: boolean

jobs:
  backup:
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Convex CLI
        run: npm install -g convex

      - name: Create backup directory
        run: |
          if (-not (Test-Path -Path "backups")) {
            New-Item -ItemType Directory -Force -Path "backups"
          }

      - name: Export Convex data
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
        run: |
          $DATE = Get-Date -Format "yyyy-MM-dd-HHmm"
          $BACKUP_PATH = "./backups/convex-backup-$DATE.zip"

          Write-Host "📤 Exporting data from Convex..."
          Write-Host "📅 Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "📁 Backup path: $BACKUP_PATH"

          # Export with file storage if requested
          $includeStorage = "${{ github.event.inputs.include_file_storage }}"
          if ($includeStorage -eq "true" -or [string]::IsNullOrEmpty($includeStorage)) {
            npx convex export --path "$BACKUP_PATH" --include-file-storage --prod
          } else {
            npx convex export --path "$BACKUP_PATH" --prod
          }

          # Get file size
          $FILE_SIZE = (Get-Item "$BACKUP_PATH").Length / 1MB
          Write-Host "📊 Backup size: $FILE_SIZE MB"

          # Export variables for next steps
          "BACKUP_PATH=$BACKUP_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BACKUP_FILENAME=convex-backup-$DATE.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FILE_SIZE=$FILE_SIZE" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Option 1: Upload to GitHub Releases (FREE & EASIEST)
      - name: Create GitHub Release for Backup
        if: github.event.inputs.upload_to_cloud != 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $DATE = Get-Date -Format "yyyy-MM-dd-HHmm"
          $TAG_NAME = "backup-$DATE"

          Write-Host "📦 Creating GitHub Release: $TAG_NAME"

          # Create release and upload backup file
          gh release create "$TAG_NAME" `
            "${{ env.BACKUP_PATH }}" `
            --title "Convex Backup $DATE" `
            --notes "Automated Convex database backup`n`nSize: ${{ env.FILE_SIZE }} MB`nDate: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" `
            --repo "${{ github.repository }}"

          Write-Host "✅ Uploaded to GitHub Releases: $TAG_NAME"

      # Cleanup: Remove old backups from GitHub Releases (keep last 30 backups)
      - name: Cleanup old GitHub Release backups
        if: github.event.inputs.upload_to_cloud != 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "🧹 Cleaning up old backup releases (keep last 30)..."

          # List all backup releases (sorted by date, newest first)
          $RELEASES = gh release list --repo "${{ github.repository }}" --limit 100 | Where-Object { $_ -match "backup-" }

          if ($RELEASES.Count -gt 30) {
            $TO_DELETE = $RELEASES | Select-Object -Skip 30
            foreach ($release in $TO_DELETE) {
              $tagName = $release.Split("`t")[0]
              Write-Host "Deleting old release: $tagName"
              gh release delete "$tagName" --yes --repo "${{ github.repository }}" --cleanup-tag
            }
          } else {
            Write-Host "No old backups to clean up."
          }
