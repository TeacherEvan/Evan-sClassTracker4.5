name: E2E Tests

on:
    workflow_run:
        workflows: ["Deploy to Staging"]
        types:
            - completed
    workflow_dispatch:
        inputs:
            staging_url:
                description: "Staging URL to test"
                required: false
                default: "https://your-staging-url.vercel.app"

jobs:
    e2e-tests:
        name: Run E2E Tests
        runs-on: self-hosted
        if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Wait for staging deployment
              run: sleep 30

            - name: Run Playwright tests
              env:
                  STAGING_URL: ${{ github.event.inputs.staging_url || secrets.STAGING_URL || 'https://your-staging-url.vercel.app' }}
              run: npx playwright test

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30

            - name: Upload test screenshots
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-screenshots
                  path: test-results/
                  retention-days: 7

            - name: Comment PR with test results
              if: github.event.workflow_run.event == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const resultsPath = 'playwright-report/results.json';

                      if (fs.existsSync(resultsPath)) {
                        const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
                        const { passed, failed, skipped } = results.stats;
                        
                        const body = `## 🎭 E2E Test Results
                        
                        - ✅ Passed: ${passed}
                        - ❌ Failed: ${failed}
                        - ⏭️ Skipped: ${skipped}
                        
                        [View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
                        
                        github.rest.issues.createComment({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body: body
                        });
                      }
