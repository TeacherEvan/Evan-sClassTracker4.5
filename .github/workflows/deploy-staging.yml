name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch: # Allow manual triggers

jobs:
  deploy-convex-staging:
    runs-on: self-hosted
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Convex backend (staging)
        run: npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_STAGING }}
          NEXT_TELEMETRY_DISABLED: 1

      - name: Get Convex URL
        id: convex
        run: |
          echo "CONVEX_URL=$(npx convex url)" >> $GITHUB_OUTPUT
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_STAGING }}

    outputs:
      convex_url: ${{ steps.convex.outputs.CONVEX_URL }}

  deploy-vercel-staging:
    needs: deploy-convex-staging
    runs-on: self-hosted
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # Removed --yes flag: not supported by current Vercel CLI
          # Non-interactive deployment is ensured by VERCEL_TOKEN
          vercel-args: "--build-env NEXT_PUBLIC_CONVEX_URL=${{ needs.deploy-convex-staging.outputs.convex_url }}"
          # No --prod flag = preview/staging deployment

      - name: Deployment summary
        run: |
          echo "✅ Staging deployment complete!"
          echo "🔗 Convex URL: ${{ needs.deploy-convex-staging.outputs.convex_url }}"
          echo "🚀 Vercel preview: Check PR or Vercel dashboard"
          echo "ℹ️  Vercel deploy command updated - removed unsupported --yes flag"
